<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson | Cognitive</title>
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      if (localStorage.getItem("sidebarCollapsed") === "true") {
        document.documentElement.classList.add("sidebar-collapsed");
      }
    } catch (error) {}
  </script>
  <script src="auth.js"></script>
</head>
<body>
  <div class="layout">

    <nav class="sidebar">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="11" fill="#2b3a52" />
          <path d="M13 14 L24 36 L35 14" fill="none" stroke="#f4ead5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M17.5 25 L24 12.5 L30.5 25" fill="none" stroke="#7fd1b0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="24" cy="36.5" r="2.2" fill="#7fd1b0" />
        </svg>
        <span class="brand-name">Cognitive</span>
      </a>
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link" href="sources.html">Sources</a>
      <a class="nav-link" href="papers.html">Papers</a>
      <a class="nav-link" href="settings.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="3.4" stroke-dasharray="3.22 3.22" />
          <path fill="currentColor" fill-rule="evenodd" d="M12 5.2 a6.8 6.8 0 1 0 0.01 0 Z M12 9.2 a2.8 2.8 0 1 1 -0.01 0 Z" />
        </svg>
        <span>Settings</span>
      </a>
    </nav>

    <main>
      <button class="menu-toggle" aria-label="Show or hide the sidebar" aria-expanded="true">☰</button>

      <p class="crumbs"><a id="back-link" href="math.html">← Back</a></p>
      <h2 class="page-heading" id="lesson-title">Lesson</h2>
      <p class="blurb" id="lesson-sub"></p>

      <div class="lesson-body">

        <section class="video-block" id="video" hidden></section>

        <div id="learn"></div>

        <h3 class="section-title">Practice</h3>

        <div class="panel lesson-progress">
          <div class="progress-row">
            <div class="progress" id="lesson-bar" role="progressbar"
                 aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span id="lesson-fill"></span>
            </div>
            <span class="progress-percent wide" id="lesson-count">0 of 0</span>
          </div>
        </div>

        <div id="problems"></div>

        <section class="panel summary" id="summary" hidden>
          <h3>Lesson complete!</h3>
          <p id="summary-text"></p>
          <a class="shop-button" id="summary-back" href="course.html">Back to course</a>
          <a class="shop-button outline" href="shop.html">Visit the shop</a>
        </section>

      </div>
    </main>

  </div>
<script src="store.js"></script>
<script src="courses.js"></script>
<script src="lessons.js"></script>
<script src="progress.js"></script>
<script src="lesson.js"></script>
<script src="script.js"></script>
</body>
</html>
